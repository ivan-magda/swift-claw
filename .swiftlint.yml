# swift-format owns layout/cosmetic style;
# SwiftLint owns complexity, correctness smells, and idiom rules.
# Formatting rules both tools would touch are disabled below so they never disagree.

included:
  - Sources
  - Tests
excluded:
  - .build

disabled_rules:
  - line_length
  - trailing_comma # swift-format adds multi-element trailing commas;
  - trailing_whitespace
  - vertical_whitespace
  - superfluous_disable_command

opt_in_rules:
  # Safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unowned_variable_capture
  - unhandled_throwing_task
  - discouraged_optional_boolean
  - discouraged_optional_collection
  # Modern Swift idioms
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - first_where
  - last_where
  - sorted_first_last
  - flatmap_over_map_reduce
  - reduce_into
  - empty_count
  - empty_string
  - toggle_bool
  - convenience_type
  - prefer_zero_over_explicit_init
  - prefer_self_type_over_type_of_self
  - shorthand_optional_binding
  - direct_return
  # Readability
  - closure_spacing
  - closure_body_length
  - collection_alignment
  - operator_usage_whitespace
  - let_var_whitespace
  - modifier_order
  - sorted_imports
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - superfluous_else
  - multiline_arguments
  - multiline_parameters
  - redundant_nil_coalescing
  - fatal_error_message
  - yoda_condition

force_cast: error
force_try: error
force_unwrapping: error
trailing_semicolon: error
duplicate_imports: error

identifier_name:
  excluded: [id, db, ts, ok, sh]

type_name:
  min_length: 3
  max_length:
    warning: 45
    error: 60

closure_body_length:
  warning: 80

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

custom_rules:
  no_print_in_production:
    name: "No print() in production code"
    regex: '(?<!\/\/)(\bprint\()'
    match_kinds:
      - identifier
    message: "Use os_log / Logger instead of print()"
    severity: warning
    excluded: ".*Tests.*"

  prefer_logger:
    name: "Prefer structured Logger"
    regex: 'NSLog\('
    message: "Use Logger (os.log) instead of NSLog"
    severity: warning

  no_objc_unless_needed:
    name: "Avoid @objc in pure Swift"
    regex: '@objc\s'
    message: "Only use @objc when Obj-C interop is required. Add a comment explaining why."
    severity: warning
    excluded: ".*Tests.*"
