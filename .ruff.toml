# Python style for the repository's scripts: PEP 8 and PEP 257, formatted and checked by
# ruff. The lint gate does not run it; see docs/ARCHITECTURE.md section 19.2.

# Only scripts: Markdown code blocks quote other projects' code as is.
include = ["*.py"]
# The oldest Python that runs the scripts: macOS ships 3.9 with the Xcode tools.
target-version = "py39"
# The ruff and Black default, within the limit PEP 8 allows a team to agree on.
line-length = 88

[lint]
select = [
  "E",    # pycodestyle errors: PEP 8 layout
  "W",    # pycodestyle warnings: PEP 8 whitespace
  "N",    # pep8-naming: PEP 8 names
  "D",    # pydocstyle: PEP 257 docstrings
  "I",    # isort: import order
  "F",    # Pyflakes: unused and undefined names
  "UP",   # pyupgrade: syntax of the target version
  "B",    # flake8-bugbear: likely bugs
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RET",  # flake8-return
  "PIE",  # flake8-pie: unnecessary statements
  "FURB", # refurb: modern idioms
  "PTH",  # flake8-use-pathlib
  "ANN",  # flake8-annotations: typed function signatures
  "PL",   # Pylint
  "RUF",  # Ruff's own rules
]

[lint.pydocstyle]
convention = "pep257"
