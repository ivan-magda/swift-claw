name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          apt-get update &&
            apt-get install -y --no-install-recommends \
              libsqlite3-dev \
              ca-certificates

      - name: Verify pinned toolchain
        run: scripts/check-toolchain.sh

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          printf 'enum ClawdVersion {\n  static let current = "%s"\n}\n' \
            "${GITHUB_REF_NAME#v}" > Sources/clawd/ClawdVersion.swift

      - name: Build release binary
        run: swift build --build-system native -c release --static-swift-stdlib --product clawd

      - name: Package Linux binary and checksum
        run: |
          binary_directory=$(swift build --build-system native -c release --show-bin-path)
          timeout 30 "$binary_directory/clawd" --version
          cp "$binary_directory/clawd" clawd-linux-x86_64
          sha256sum clawd-linux-x86_64 > clawd-linux-x86_64.sha256

      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4.2.2
        with:
          subject-path: clawd-linux-x86_64

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: clawd-linux-x86_64*

  macos-binary:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select and verify pinned Xcode toolchain
        run: |
          source BuildTools/lint-versions.env
          sudo xcode-select -s "/Applications/Xcode_${CLAW_XCODE_VERSION}.app"
          scripts/check-toolchain.sh

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          printf 'enum ClawdVersion {\n  static let current = "%s"\n}\n' \
            "${GITHUB_REF_NAME#v}" > Sources/clawd/ClawdVersion.swift

      - name: Build release binary
        run: swift build -c release --product clawd

      - name: Package macOS binary, compatibility runtime and checksums
        run: |
          binary_directory=$(swift build -c release --show-bin-path)
          scripts/package-macos.sh "$binary_directory/clawd" .

      - name: Attest provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            clawd-macos-arm64
            libswiftCompatibilitySpan.dylib

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            clawd-macos-arm64*
            libswiftCompatibilitySpan.dylib

  macos-release-runtime:
    needs: macos-binary
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Download macOS release package
        uses: actions/download-artifact@v8
        with:
          name: macos
          path: ${{ runner.temp }}/macos-package

      - name: Verify release startup on macOS 15
        working-directory: ${{ runner.temp }}/macos-package
        run: |
          shasum -a 256 -c clawd-macos-arm64.sha256
          chmod 755 clawd-macos-arm64 libswiftCompatibilitySpan.dylib
          python3 - <<'PYTHON'
          import subprocess
          subprocess.run(
              ["./clawd-macos-arm64", "--version"], env={"PATH": "/usr/bin:/bin"},
              check=True, timeout=30,
          )
          PYTHON

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify installer staging without network access
        run: |
          docker run --rm --network none --tmpfs /tmp:noexec \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            ubuntu:24.04 sh scripts/test-install.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-binary, macos-binary, macos-release-runtime, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Assemble release files and checksum manifest
        run: |
          cp .env.example dist/clawd.env.example
          cp \
            deploy/run-clawd.sh \
            deploy/swift-claw.service \
            deploy/com.ivanmagda.swift-claw.plist \
            install.sh \
            dist/

          cd dist
          cat \
            linux/clawd-linux-x86_64.sha256 \
            macos/clawd-macos-arm64.sha256 > SHA256SUMS
          sha256sum \
            clawd.env.example \
            run-clawd.sh \
            swift-claw.service \
            com.ivanmagda.swift-claw.plist \
            install.sh >> SHA256SUMS

          cat SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes)
          [[ "${GITHUB_REF_NAME}" == *-* ]] && flags+=(--prerelease)

          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
            dist/linux/clawd-linux-x86_64 \
            dist/macos/clawd-macos-arm64 \
            dist/macos/libswiftCompatibilitySpan.dylib \
            dist/SHA256SUMS \
            dist/clawd.env.example \
            dist/run-clawd.sh \
            dist/swift-claw.service \
            dist/com.ivanmagda.swift-claw.plist \
            dist/install.sh
