name: Python Page Benchmark

on:
  push:
    branches: [main]
    paths:
      - "experiments/scheduled-task-learning/page-change/**"
      - ".github/workflows/python-page-benchmark.yml"
  pull_request:
    paths:
      - "experiments/scheduled-task-learning/page-change/**"
      - ".github/workflows/python-page-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-page-benchmark-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: experiments/scheduled-task-learning/page-change

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Run scripts/lint.sh
        run: scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Run scripts/test.sh
        run: scripts/test.sh
