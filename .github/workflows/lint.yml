name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: swift:6.3.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run swift-format
        run: swift format lint --recursive --strict --parallel .
      - name: Enforce multiline guard bodies
        run: >-
          swift run --package-path BuildTools swiftformat
          --config "$GITHUB_WORKSPACE/BuildTools/guard-bodies.swiftformat" --lint
          "$GITHUB_WORKSPACE/Sources" "$GITHUB_WORKSPACE/Tests" "$GITHUB_WORKSPACE/Package.swift"
          "$GITHUB_WORKSPACE/BuildTools/Package.swift" "$GITHUB_WORKSPACE/BuildTools/Sources"

  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run swiftlint
        uses: docker://ghcr.io/realm/swiftlint:0.65.0

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck -s sh install.sh deploy/run-clawd.sh
