name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.4.0-noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned SwiftLint
        shell: bash
        run: |
          source BuildTools/lint-versions.env

          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl unzip

          release_url="https://github.com/realm/SwiftLint/releases/download/${CLAW_LINT_SWIFTLINT_VERSION}"
          curl --fail --location --silent --show-error \
            "${release_url}/swiftlint_linux_amd64.zip" \
            --output /tmp/swiftlint.zip
          printf '%s  /tmp/swiftlint.zip\n' "$CLAW_LINT_SWIFTLINT_LINUX_SHA256" \
            | sha256sum --check

          unzip -q /tmp/swiftlint.zip -d /opt/swiftlint
          printf '%s\n' /opt/swiftlint >> "$GITHUB_PATH"

      - name: Cache lint build tools
        uses: actions/cache@v6
        with:
          path: BuildTools/.build
          key: >-
            lint-release-${{ runner.os }}-${{ hashFiles(
              'BuildTools/Package.swift',
              'BuildTools/Package.resolved',
              'BuildTools/lint-versions.env'
            ) }}

      - name: Canonical local and CI gate
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/lint.sh

      - name: Verify formatter workflow
        run: scripts/test-lint.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          source BuildTools/lint-versions.env
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "koalaman/shellcheck:v${CLAW_SHELLCHECK_VERSION}" \
            -s sh install.sh deploy/run-clawd.sh scripts/test-install.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "koalaman/shellcheck:v${CLAW_SHELLCHECK_VERSION}" \
            -x scripts/check-toolchain.sh scripts/package-macos.sh scripts/lint.sh scripts/test-lint.sh
