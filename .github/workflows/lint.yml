name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift:6.3.3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned SwiftLint
        shell: bash
        run: |
          source BuildTools/lint-versions.env
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl unzip
          curl --fail --location --silent --show-error \
            "https://github.com/realm/SwiftLint/releases/download/${CLAW_LINT_SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" \
            --output /tmp/swiftlint.zip
          printf '%s  /tmp/swiftlint.zip\n' "$CLAW_LINT_SWIFTLINT_LINUX_SHA256" | sha256sum --check
          unzip -q /tmp/swiftlint.zip -d /opt/swiftlint
          printf '%s\n' /opt/swiftlint >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: BuildTools/.build
          key: lint-${{ runner.os }}-${{ hashFiles('BuildTools/Package.swift', 'BuildTools/Package.resolved', 'BuildTools/lint-versions.env') }}
      - name: Canonical local and CI gate
        run: scripts/lint.sh
      - name: Verify formatter workflow
        run: scripts/test-lint.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: |
          shellcheck -s sh install.sh deploy/run-clawd.sh
          shellcheck -x scripts/lint.sh scripts/test-lint.sh
