name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: swift:6.3.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run swift-format
        run: swift format lint --recursive --strict --parallel .

  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run swiftlint
        uses: docker://ghcr.io/realm/swiftlint:0.65.0

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run shellcheck
        run: shellcheck -s sh install.sh deploy/run-clawd.sh
