name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04-arm
    container: swift:6.4.0-noble
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          apt-get update &&
            apt-get install -y --no-install-recommends \
              libsqlite3-dev \
              ca-certificates \
              tzdata \
              zstd

      - name: Verify pinned toolchain
        id: toolchain
        run: |
          scripts/check-toolchain.sh

          toolchain_key=$(swift --version | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-

      - name: Build and run tests
        run: swift test -Xswiftc -enable-incremental-file-hashing
        env:
          SWIFT_BACKTRACE: enable=yes

      - name: Re-run the concurrency-sensitive suites on one cooperative thread
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          swift test --skip-build \
            --filter CommandApprovalCancelSignalRaceTests \
            --filter ApprovalExpiryServiceTests \
            --filter ApprovalWaiterTests \
            --filter ApprovalBootReconcilerTests \
            --filter TrialSerializationTests

  test-macos:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select and verify pinned Xcode toolchain
        id: toolchain
        run: |
          source BuildTools/lint-versions.env
          sudo xcode-select -s "/Applications/Xcode_${CLAW_XCODE_VERSION}.app"
          scripts/check-toolchain.sh

          toolchain_key=$(
            {
              swift --version
              xcodebuild -version
              xcrun --show-sdk-version
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-

      - name: Build and run tests outside native Coder integration
        run: swift test -Xswiftc -enable-incremental-file-hashing --skip ClawCoderTests

      - name: Run native Coder integration in a separate test process
        run: swift test --skip-build --filter ClawCoderTests

  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install, re-run, uninstall against the latest release
        run: |
          sh install.sh
          "$HOME/.swift-claw/bin/clawd" --version
          sh install.sh # idempotent upgrade path

          sh install.sh --uninstall
          test ! -e "$HOME/.swift-claw/bin/clawd"
          test -f "$HOME/.swift-claw/clawd.env"

          sh install.sh --uninstall --purge
          test ! -e "$HOME/.swift-claw"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          source BuildTools/lint-versions.env
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            "rhysd/actionlint:${CLAW_ACTIONLINT_VERSION}" -color

      - name: zizmor
        run: |
          source BuildTools/lint-versions.env
          pipx run "zizmor==${CLAW_ZIZMOR_VERSION}" .
