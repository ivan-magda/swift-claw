name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          apt-get update &&
            apt-get install -y --no-install-recommends \
              libsqlite3-dev \
              ca-certificates \
              tzdata \
              zstd

      - name: Verify pinned toolchain
        id: toolchain
        run: |
          scripts/check-toolchain.sh

          toolchain_key=$(swift --version | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-

      - name: Validate Linux release build
        run: |
          swift build --build-system native -c release --static-swift-stdlib --product clawd
          binary_directory=$(swift build --build-system native -c release --show-bin-path)
          "$binary_directory/clawd" --version

      - name: Build and run tests
        run: swift test -Xswiftc -enable-incremental-file-hashing
        env:
          SWIFT_BACKTRACE: enable=yes

      - name: Re-run the concurrency-sensitive suites on one cooperative thread
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          swift test --skip-build \
            --filter CommandApprovalCancelSignalRaceTests \
            --filter ApprovalExpiryServiceTests \
            --filter ApprovalWaiterTests \
            --filter ApprovalBootReconcilerTests \
            --filter TrialSerializationTests

  test-macos:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select and verify pinned Xcode toolchain
        id: toolchain
        run: |
          source BuildTools/lint-versions.env
          sudo xcode-select -s "/Applications/Xcode_${CLAW_XCODE_VERSION}.app"
          scripts/check-toolchain.sh

          toolchain_key=$(
            {
              swift --version
              xcodebuild -version
              xcrun --show-sdk-version
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Install pinned SwiftLint
        run: |
          source BuildTools/lint-versions.env
          release_url="https://github.com/realm/SwiftLint/releases/download/${CLAW_LINT_SWIFTLINT_VERSION}"
          archive="$RUNNER_TEMP/swiftlint.zip"
          curl --fail --location --silent --show-error \
            "${release_url}/portable_swiftlint.zip" --output "$archive"
          printf '%s  %s\n' "$CLAW_LINT_SWIFTLINT_MACOS_SHA256" "$archive" \
            | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftlint"
          printf '%s\n' "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Cache Swift package build artifacts
        uses: actions/cache@v6
        with:
          path: |
            .build
            BuildTools/.build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              'BuildTools/Package.swift',
              'BuildTools/Package.resolved',
              'BuildTools/lint-versions.env',
              '.github/workflows/ci.yml'
            ) }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              'BuildTools/Package.swift',
              'BuildTools/Package.resolved',
              'BuildTools/lint-versions.env',
              '.github/workflows/ci.yml'
            ) }}-

      - name: Canonical local and CI style gate
        run: scripts/lint.sh

      - name: Verify formatter workflow
        run: scripts/test-lint.sh

      - name: Validate macOS release build
        run: |
          swift build -c release --product clawd
          binary_directory=$(swift build -c release --show-bin-path)
          scripts/package-macos.sh "$binary_directory/clawd" "$RUNNER_TEMP/macos-package"

      - name: Upload macOS release package for runtime validation
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-package
          path: ${{ runner.temp }}/macos-package/
          if-no-files-found: error
          retention-days: 1

      - name: Build and run tests outside native Coder integration
        run: swift test -Xswiftc -enable-incremental-file-hashing --skip ClawCoderTests

      - name: Run native Coder integration in a separate test process
        run: swift test --skip-build --filter ClawCoderTests

  macos-release-runtime:
    needs: test-macos
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Download the Xcode 27 release package
        uses: actions/download-artifact@v8
        with:
          name: macos-release-package
          path: ${{ runner.temp }}/macos-package

      - name: Validate the package on the oldest supported macOS
        working-directory: ${{ runner.temp }}/macos-package
        run: |
          shasum -a 256 -c clawd-macos-arm64.sha256
          chmod 755 clawd-macos-arm64 libswiftCompatibilitySpan.dylib
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          binary = str(Path("clawd-macos-arm64").resolve())
          with tempfile.TemporaryDirectory(prefix="clawd-release-") as state_root:
              environment = {
                  "PATH": os.environ["PATH"],
                  "CLAW_STATE_ROOT": state_root,
                  "CLAW_LLM_BASE_URL": "http://localhost:9/v1",
                  "CLAW_LLM_MODEL": "test-model",
              }
              subprocess.run([binary, "--version"], env=environment, check=True, timeout=30)
              result = subprocess.run(
                  [binary, "doctor", "--check-config", "--json"], env=environment,
                  capture_output=True, text=True, timeout=30,
              )
              assert result.returncode == 11, (result.returncode, result.stdout, result.stderr)
              rows = {row["key"]: row for row in json.loads(result.stdout)["checks"]}
              assert rows["config"]["ok"] and rows["config"]["value"] == "OK", rows
              print("Packaged release: version and isolated config checks passed")
          PYTHON

  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify installer staging without network access
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none --tmpfs /tmp:noexec \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            ubuntu:24.04 sh scripts/test-install.sh

      - name: Install, re-run, uninstall against the latest release
        run: |
          sh install.sh
          "$HOME/.swift-claw/bin/clawd" --version
          sh install.sh # idempotent upgrade path

          sh install.sh --uninstall
          test ! -e "$HOME/.swift-claw/bin/clawd"
          test -f "$HOME/.swift-claw/clawd.env"

          sh install.sh --uninstall --purge
          test ! -e "$HOME/.swift-claw"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          source BuildTools/lint-versions.env
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            "rhysd/actionlint:${CLAW_ACTIONLINT_VERSION}" -color

      - name: zizmor
        run: |
          source BuildTools/lint-versions.env
          pipx run "zizmor==${CLAW_ZIZMOR_VERSION}" .
