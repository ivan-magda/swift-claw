name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-linux
            runner: ubuntu-24.04-arm
            image: swift:6.3-noble
            swift: '6.3'
          - name: test-linux-swift-6.4
            runner: ubuntu-24.04
            image: swift:6.4.0-noble
            swift: '6.4'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          apt-get update &&
            apt-get install -y --no-install-recommends \
              libsqlite3-dev \
              ca-certificates \
              tzdata \
              zstd

      - name: Show toolchain
        id: toolchain
        env:
          EXPECTED_SWIFT: ${{ matrix.swift }}
        run: |
          swift --version
          swift --version 2>&1 | grep -qF "Swift version $EXPECTED_SWIFT" || {
            echo "::error::Expected a Swift $EXPECTED_SWIFT.x toolchain on this runner"
            exit 1
          }

          toolchain_key=$(swift --version | sha256sum | cut -d ' ' -f 1)
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-

      - name: Validate candidate Linux release build
        if: matrix.swift == '6.4'
        run: |
          swift build -c release --static-swift-stdlib --product clawd
          .build/release/clawd --version

      - name: Build and run tests
        run: swift test -Xswiftc -enable-incremental-file-hashing
        env:
          SWIFT_BACKTRACE: enable=yes

      - name: Re-run the concurrency-sensitive suites on one cooperative thread
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: |
          swift test --skip-build \
            --filter CommandApprovalCancelSignalRaceTests \
            --filter ApprovalExpiryServiceTests \
            --filter ApprovalWaiterTests \
            --filter ApprovalBootReconcilerTests \
            --filter TrialSerializationTests

  test-macos:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test-macos
            runner: macos-26
            xcode: '26.6'
            swift: '6.3'
          - name: test-macos-xcode-27
            runner: xcode-27
            xcode: '27.0'
            swift: '6.4'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode toolchain
        id: toolchain
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
          EXPECTED_SWIFT: ${{ matrix.swift }}
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

          xcodebuild -version
          swift --version
          swift --version 2>&1 | grep -qF "Swift version $EXPECTED_SWIFT" || {
            echo "::error::Expected a Swift $EXPECTED_SWIFT.x toolchain on this runner"
            exit 1
          }

          toolchain_key=$(
            {
              swift --version
              xcodebuild -version
              xcrun --show-sdk-version
            } | shasum -a 256 | cut -d ' ' -f 1
          )
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Swift package build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-${{ github.sha }}
          restore-keys: >-
            ${{ runner.os }}-${{ runner.arch }}-spm-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles(
              'Package.swift',
              'Package.resolved',
              '.github/workflows/ci.yml'
            ) }}-

      - name: Validate candidate macOS release build
        if: matrix.swift == '6.4'
        run: |
          swift build -c release --product clawd
          .build/release/clawd --version

      - name: Build and run tests outside native Coder integration
        run: swift test -Xswiftc -enable-incremental-file-hashing --skip ClawCoderTests

      - name: Run native Coder integration in a separate test process
        run: swift test --skip-build --filter ClawCoderTests

  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install, re-run, uninstall against the latest release
        run: |
          sh install.sh
          "$HOME/.swift-claw/bin/clawd" --version
          sh install.sh # idempotent upgrade path

          sh install.sh --uninstall
          test ! -e "$HOME/.swift-claw/bin/clawd"
          test -f "$HOME/.swift-claw/clawd.env"

          sh install.sh --uninstall --purge
          test ! -e "$HOME/.swift-claw"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 -color

      - name: zizmor
        run: pipx run zizmor==1.26.1 .
