version: 2
updates:
  - package-ecosystem: "swift"
    # A BuildTools SwiftFormat bump must also update its pin in BuildTools/lint-versions.env.
    directories: ["/", "/BuildTools"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      swift-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
